common:
  img_topic: "/alphasense/cam0/image_raw"
  lid_topic: "/hesai/pandar"
  imu_topic: "/alphasense/imu"
  img_en: 1
  lidar_en: 1
  ros_driver_bug_fix: false

extrin_calib:
  # Hilti-2022
  extrinsic_T: [-0.001, -0.00855, 0.055] 
  extrinsic_R: [0, -1, 0, -1, 0, 0, 0, 0, -1]
  
  # Hilti-2023
  # extrinsic_T: [-0.006730146149038548, -0.006897049862999071, 0.049898628062256645] 
  # extrinsic_R: [0.006609639848469365, -0.9999773650294649, 0.0012578115132016717, 
  #               -0.9999762249571927, -0.006612093869054189, -0.0019569708811106104, 
  #               0.001965243352927244, -0.0012448467359610184, -0.9999972940839232]

  # Hilti
  Rcl: [ -0.999926,  -0.00670802, 0.0101073,
         -0.0100912, -0.00242564, -0.999946,
          0.00673218,-0.999975, 0.00235777 ]
  Pcl: [ -0.0549762, 0.0675401, -0.0520599 ]

time_offset:
  imu_time_offset: 0.0
  img_time_offset: 0.0
  exposure_time_init: 0.0

preprocess:
  hilti_en: true
  point_filter_num: 1
  filter_size_surf: 0.1 # 0.2
  lidar_type: 5 # HesaiXT32
  scan_line: 32
  blind: 0.6 # 0.1 0.3
 
vio:
  max_iterations: 5
  outlier_threshold: 500
  img_point_cov: 1000
  patch_size: 8
  patch_pyrimid_level: 4
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1

imu:
  imu_en: true
  imu_int_frame: 30
  max_propagation_interval: 0.5 # s; larger forward gaps trigger a coordinated reset
  acc_cov: 0.5 # 0.1
  gyr_cov: 0.01
  b_acc_cov: 0.0001 # 0.1
  b_gyr_cov: 0.0001 # 0.1

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.0001 # 0.0025
  voxel_size: 0.4
  max_layer: 2
  max_points_num: 100
  layer_init_num: [5, 5, 5, 5, 5]

local_map:  
  map_sliding_en: false
  half_map_size: 100
  sliding_thresh: 8

uav:
  imu_rate_odom: false
  gravity_align_en: false

publish:
  dense_map_en: true
  pub_effect_point_en: false 
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0

evo:
  seq_name: "exp09_cupola"
  pose_output_en: true

pcd_save:
  pcd_save_en: false
  allow_unbounded_buffer: false
  type: 0 # 0: World Frame, 1: Body Frame;
  colmap_output_en: false # need to set interval = -1
  filter_size_pcd: 0.15
  interval: -1
  # how many LiDAR frames saved in each pcd file;
  # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

image_save:
  img_save_en: false
  interval: 1

# MODIFICATIONS: degradation-aware adaptive mapping (Innovations 1-23)
adaptive:
  degeneracy_aware_en: true
  coupled_degeneracy_en: true # Innovation 22: prior-whitened full 6DoF coupling
  degeneracy_alpha: 10.0
  degeneracy_tau: 0.05
  degeneracy_min_factor: 0.08
  degeneracy_prior_eigen_ratio_floor: 1.0e-9 # bounded relative SPD floor for whitening
  normal_anisotropy_weight_en: true # independent Innovation 4 ablation switch
  normal_balance_en: false
  normal_balance_target_fraction: 0.35
  normal_balance_min_weight: 0.20
  incidence_weight_en: false
  incidence_min_weight: 0.10
  incidence_weight_power: 1.0
  robust_kernel_en: true
  robust_kernel_type: cauchy
  robust_kernel_delta: 3.0
  robust_kernel_min_weight: 0.05
  lio_hard_outlier_reject_en: true
  lio_hard_outlier_residual_sigma: 2.75
  lio_hard_outlier_dynamic_score: 0.40
  scan_distortion_weight_en: false
  scan_distortion_rot_ref: 0.25
  scan_distortion_trans_ref: 0.20
  scan_distortion_noise_gain: 2.0
  scan_distortion_min_weight: 0.30
  lidar_return_quality_en: true
  lidar_intensity_ref: 80.0
  lidar_saturation_ref: 240.0
  lidar_range_ref: 35.0
  lidar_range_adaptive_en: true
  lidar_range_candidate_source_en: true
  lidar_range_ref_max: 80.0
  lidar_range_quantile: 0.70
  lidar_range_ref_ema_alpha: 0.15
  lidar_density_ref: 20.0
  lidar_return_min_weight: 0.25
  map_write_gate_en: true
  map_write_residual_sigma: 2.5
  map_write_min_score: 0.35
  map_write_unmatched_risk_thresh: 0.45
  map_write_min_return: 0.20
  map_write_recovery_en: true
  map_write_recovery_trigger_frames: 8
  map_write_recovery_budget_ratio: 0.05
  map_write_recovery_min_return: 0.55
  map_write_recovery_max_dynamic: 0.25
  map_write_recovery_max_risk: 0.85
  dynamic_object_filter_en: true
  dynamic_residual_sigma: 3.0
  dynamic_map_reject_score: 0.65
  dynamic_motion_gain: 0.50
  total_lio_min_weight: 0.03
  plane_quality_weight_en: false # optional fitted-plane precision ablation switch
  vio_quality_en: true
  vio_cov_fusion_en: true
  vio_cov_scale_max: 100.0
  min_gen_quality: 0.15
  min_update_quality: 0.18
  min_ref_update_quality: 0.20
  lio_info_warmup_frames: 50
  map_starving_min_quality: 0.08
  visual_lifecycle_en: true
  visual_lifecycle_max_fail: 6
  visual_lifecycle_min_quality: 0.18
  visual_view_weight_en: true
  visual_view_min_weight: 0.20
  visual_view_min_cos: 0.17
  visual_affine_det_ref: 3.0
  cross_modal_gate_en: true
  cross_modal_cov_gain: 3.0
  cross_modal_map_risk_thresh: 0.60
  cross_modal_min_lio_points: 80
  cross_modal_min_track_points: 30
  temporal_degrade_en: true
  temporal_jitter_ref: 0.02
  temporal_lio_vio_gap_ref: 0.05
  temporal_exposure_jump_ref: 0.35
  temporal_cov_gain: 2.0
  temporal_motion_gain: 0.75
  temporal_map_risk_thresh: 0.65
  ref_patch_adaptive_en: true
  ref_patch_max_age: 120
  ref_patch_min_score: 0.30
  ref_patch_min_weight: 0.30
  ref_patch_view_cos_min: 0.35
  ref_patch_exposure_ref: 0.35
  ref_patch_switch_margin: 0.05
  motion_degrade_en: true
  motion_vel_max: 5.0
  motion_gyr_max: 2.0
  motion_jerk_ref: 50.0
  motion_risk_tau: 0.10
  motion_noise_gain: 2.0
  vibration_degrade_en: true
  vibration_acc_ref: 4.0
  vibration_gyr_ref: 0.6
  vibration_noise_gain: 1.5
  vibration_lpf_tau: 0.05
  preprocess_adaptive_en: false
  preprocess_intensity_quality_en: true # use native-unit return quality in adaptive sampling
  preprocess_max_filter_num: 6
  preprocess_near_dist: 5.0
  preprocess_far_dist: 30.0
  preprocess_bad_hysteresis_frames: 2
  preprocess_good_hysteresis_frames: 6

debug:
  verbose_runtime_log: false
  state_log_en: false
  imu_log_en: false

common:
  img_topic: "/left_camera/image"
  lid_topic: "/livox/lidar"
  imu_topic: "/livox/imu"
  img_en: 1
  lidar_en: 1
  ros_driver_bug_fix: false

extrin_calib:
  extrinsic_T: [-0.011, -0.02329, 0.04412]
  # D02 rotation-only fit for lili_2_out_first500s_fastlivo.
  # Recalibrate with independent multi-axis motion before transferring hardware.
  extrinsic_R: [ 0.882989039, -0.034845134, -0.468098465,
                 0.023134460,  0.999259486, -0.030745361,
                 0.468823158,  0.016318612,  0.883141296 ]
  Rcl: [ -0.033217,  -0.999440,   0.004072,
        0.484123,  -0.019654,  -0.874780,
        0.874370,  -0.027087,   0.484504]
  Pcl: [  0.007383,  -0.134246,   0.014185]
time_offset: 
  imu_time_offset: 0.0
  img_time_offset: 0.1
  exposure_time_init: 0.0

preprocess:
  point_filter_num: 1
  filter_size_surf: 0.1
  lidar_type: 1 # Livox mid360 LiDAR
  scan_line: 4
  blind: 0.8

vio:
  max_iterations: 5
  outlier_threshold: 1000 # 78 100 156 #100 200 500 700 infinite
  img_point_cov: 100 # 100 1000 
  patch_size: 8
  patch_pyrimid_level: 4
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1

imu:
  imu_en: true
  imu_int_frame: 30
  gravity_est_en: true
  ba_bg_est_en: true
  acc_cov: 0.5 # 0.2
  gyr_cov: 0.3 # 0.5
  b_acc_cov: 0.0001 # 0.1
  b_gyr_cov: 0.0001 # 0.1

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.0025 # 0.005
  voxel_size: 0.5
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

local_map:  
  map_sliding_en: false
  half_map_size: 100
  sliding_thresh: 8

uav:
  imu_rate_odom: false
  gravity_align_en: false

publish:
  dense_map_en: true
  pub_effect_point_en: false 
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0

evo:
  seq_name: "lili_2_out_first500s_fastlivo_D02"
  pose_output_en: true

diagnostic:
  d02_turn_risk_csv_en: true
  d02_inertial_csv_en: true
  d02_lio_innovation_csv_en: true
  d02_reference_map_csv_en: true
  d02_measurement_model_csv_en: true
  reference_map_learn_until_s: 40.0
  yaw_rate_warn_deg: 25.0
  bad_residual_threshold: 0.20
  d02_structure_csv_en: true
  structure_min_effective_ratio: 0.70
  structure_max_avg_residual: 0.08
  structure_max_bad_residual_ratio: 0.15
  structure_max_update_pos_m: 0.30
  structure_max_update_rot_deg: 5.0
  structure_min_ground_normals: 50
  structure_min_facade_normals: 50
  structure_stable_frames: 5
  structure_require_visual: false
  structure_min_visual_points: 20
  structure_min_visual_occupancy: 0.02
  structure_max_visual_age_s: 0.25

pcd_save:
  pcd_save_en: false
  type: 0 # 0: World Frame, 1: Body Frame;
  colmap_output_en: false # need to set interval = -1
  filter_size_pcd: 0.15
  interval: -1
  # how many LiDAR frames saved in each pcd file;
  # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

image_save:
  img_save_en: false
  interval: 1
